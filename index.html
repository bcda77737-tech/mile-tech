<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>상테크 마스터 Pro</title>
    <style>
        :root { --primary: #003366; --red: #ff4d4d; --blue: #3498db; --bg: #f0f4f8; --lock: #5d6d7e; --gray: #bdc3c7; --orange: #f39c12; }
        body { font-family: -apple-system, sans-serif; padding: 45px 15px 60px 15px; background-color: var(--bg); margin: 0; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        #clock { font-weight: bold; color: #555; font-size: 14px; min-width: 130px; }
        .top-btns { display: flex; gap: 5px; }
        .top-btn-item { padding: 6px 10px; border-radius: 20px; text-decoration: none; font-weight: bold; font-size: 11px; text-align: center; border: none; cursor: pointer; }
        .undo-btn { background: #7f8c8d; color: white; }
        .hanbang-btn { background: #ffcc00; color: #000; }
        .gogo-btn { background: #000; color: #fff; }

        .calc-card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px; border-top: 4px solid var(--primary); }
        .calc-card.locked { border-top-color: var(--lock); background-color: #f8f9fa; }
        .card-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 8px; }
        
        .name-input-wrapper { display: flex; gap: 5px; width: 60%; align-items: center; }
        .name-select { width: 80px; padding: 5px; border: none; border-bottom: 1.5px solid #ddd; font-weight: bold; color: var(--primary); background: transparent; outline: none; }
        .name-custom-input { flex-grow: 1; padding: 5px; border: none; border-bottom: 1.5px solid #ddd; font-weight: bold; font-size: 15px; color: var(--primary); background: transparent; outline: none; }

        .update-time { font-size: 9px; color: #999; flex-grow: 1; text-align: right; }
        .lock-btn { background: white; border: 1.5px solid var(--gray); border-radius: 6px; padding: 4px 8px; font-size: 11px; font-weight: bold; min-width: 55px; }
        .lock-btn.active { background: var(--lock); color: white; }
        .del-item-btn { background: var(--red); color: white; border: none; border-radius: 50%; width: 24px; height: 24px; font-weight: bold; }

        .input-row { display: flex; gap: 8px; margin-bottom: 10px; }
        .input-box { flex: 1; }
        label { display: block; font-size: 11px; color: #888; margin-bottom: 3px; }
        input[type="number"], input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; -webkit-appearance: none; }
        
        .result-area { margin-top: 12px; padding-top: 10px; border-top: 1px dashed #eee; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; display: none; }
        .res-item { background: #f9f9f9; padding: 8px; border-radius: 6px; text-align: center; }
        .res-val { font-weight: bold; font-size: 14px; display: block; }
        .unit-price { grid-column: span 2; background: #fff4f4; color: #e74c3c; }

        .add-btn { width: 100%; padding: 12px; background: white; border: 2px dashed var(--primary); border-radius: 12px; color: var(--primary); font-weight: bold; margin-bottom: 20px; }
        .clear-all-btn { background: #95a5a6; color: white; width: 100%; margin-bottom: 15px; padding: 10px; border:none; border-radius:6px; font-weight:bold; }

        .calc-wrapper { background: #fff; border-radius: 12px; margin-bottom: 20px; border: 1px solid #ddd; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .calc-trigger { width: 100%; padding: 12px; background: #34495e; color: white; border: none; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .calc-content { display: none; padding: 15px; }
        .calc-content.active { display: block; }
        .calc-display { width: 100%; height: 50px; background: #2c3e50; color: #2ecc71; border-radius: 8px; text-align: right; padding: 10px; font-size: 22px; font-family: monospace; font-weight: bold; margin-bottom: 10px; box-sizing: border-box; line-height: 30px; }
        
        .mem-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
        .mem-btn { padding: 8px; border: 1px solid var(--orange); border-radius: 6px; background: white; color: var(--orange); font-size: 11px; font-weight: bold; }
        .mem-btn.active { background: var(--orange); color: white; }

        .calc-main-grid { display: grid; grid-template-columns: 3fr 1fr; gap: 8px; }
        .num-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .op-pad { display: grid; grid-template-columns: 1fr; gap: 8px; }
        .c-btn { padding: 15px 5px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; background: #f0f2f5; box-shadow: 0 2px 0 #ccc; }
        .c-btn.op { background: var(--blue); color: white; box-shadow: 0 2px 0 #2980b9; }
        .c-btn.eq { background: var(--primary); color: white; box-shadow: 0 2px 0 #002244; }
        .c-btn.clr { background: var(--red); color: white; box-shadow: 0 2px 0 #c0392b; }

        .share-btn { width: 100%; padding: 12px; background: var(--blue); color: white; border: none; border-radius: 8px; font-weight: bold; }
        textarea { width: 100%; height: 160px; border: 1px solid #ddd; border-radius: 8px; padding: 10px; box-sizing: border-box; background: transparent; }
        
        .feedback-section { background: white; padding: 15px; border-radius: 12px; border: 1px solid #ddd; margin-bottom: 50px; }
    </style>
</head>
<body>

<div class="header">
    <div id="clock">로딩 중...</div>
    <div class="top-btns">
        <button class="top-btn-item undo-btn" onclick="undoLastAction()">↩ 되돌리기</button>
        <a href="https://1bang.kr/pages/tp" class="top-btn-item hanbang-btn" target="_blank">한방</a>
        <a href="https://gogoexchange.co.kr/" class="top-btn-item gogo-btn" target="_blank">고고</a>
    </div>
</div>

<button class="clear-all-btn" onclick="clearAllData()">🔄 모든 데이터 초기화</button>

<div id="calculator-list"></div>
<button class="add-btn" onclick="addCalculator()">+ 새로운 항목 추가</button>

<div class="calc-wrapper">
    <button class="calc-trigger" onclick="toggleCalc()">
        <span>🧮 일반 합산 계산기</span>
        <span id="calc-arrow">▼</span>
    </button>
    <div id="calc-content" class="calc-content">
        <div id="calc-display" class="calc-display">0</div>
        <div class="mem-grid">
            <button class="mem-btn" id="mem1" onclick="handleMemory(1)">M1 저장</button>
            <button class="mem-btn" id="mem2" onclick="handleMemory(2)">M2 저장</button>
            <button class="mem-btn" id="mem3" onclick="handleMemory(3)">M3 저장</button>
        </div>
        <div class="calc-main-grid">
            <div class="num-pad">
                <button class="c-btn" onclick="inputCalc('7')">7</button>
                <button class="c-btn" onclick="inputCalc('8')">8</button>
                <button class="c-btn" onclick="inputCalc('9')">9</button>
                <button class="c-btn" onclick="inputCalc('4')">4</button>
                <button class="c-btn" onclick="inputCalc('5')">5</button>
                <button class="c-btn" onclick="inputCalc('6')">6</button>
                <button class="c-btn" onclick="inputCalc('1')">1</button>
                <button class="c-btn" onclick="inputCalc('2')">2</button>
                <button class="c-btn" onclick="inputCalc('3')">3</button>
                <button class="c-btn clr" onclick="clearCalc()">C</button>
                <button class="c-btn" onclick="inputCalc('0')">0</button>
                <button class="c-btn eq" onclick="runCalc()">=</button>
            </div>
            <div class="op-pad">
                <button class="c-btn op" onclick="inputCalc('/')">÷</button>
                <button class="c-btn op" onclick="inputCalc('*')">×</button>
                <button class="c-btn op" onclick="inputCalc('-')">-</button>
                <button class="c-btn op" style="height:100%" onclick="inputCalc('+')">+</button>
            </div>
        </div>
    </div>
</div>

<div style="display: flex; gap: 8px; margin-bottom: 25px;">
    <button class="share-btn" onclick="copyToClipboard()" style="flex: 1;">📋 리포트 복사</button>
    <button id="reportSendBtn" class="share-btn" onclick="sendReportToSheet()" style="flex: 1; background: var(--orange);">📤 시트로 전송</button>
</div>

<div style="font-weight:bold; font-size:14px; margin-bottom:8px;">📝 개인 메모장</div>
<div style="background:#fff9c4; padding:12px; border-radius:12px; margin-bottom:20px;">
    <textarea id="mainMemo" placeholder="메모를 입력하세요..."></textarea>
</div>

<div class="feedback-section">
    <div style="font-weight:bold; margin-bottom:10px;">📢 건의사항</div>
    <input type="text" id="opinionInput" style="width:100%; padding:12px; margin-bottom:8px; border-radius:8px; border:1px solid #ddd; box-sizing:border-box;" placeholder="의견을 남겨주세요.">
    <button id="sendBtn" onclick="sendOpinion(event)" style="width:100%; padding:12px; background:var(--primary); color:white; border:none; border-radius:8px; font-weight:bold;">의견 보내기</button>
    <div id="feedbackList" class="feedback-list"></div>
</div>

<script>
    let calcExpr = "";
    let memories = { 1: null, 2: null, 3: null };
    let lastBackup = null;
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbycTfBzRS5NoIB9kSySED6_-KWyeUiZF02Byd_X7Kd0mgBtCncxtgxSaXYzRGsZ350/exec";

    function updateClock() {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleString();
    }
    setInterval(updateClock, 1000); updateClock();

    function backupCurrentState() {
        const keys = Object.keys(localStorage).filter(k => k.startsWith('calcData'));
        const currentData = {};
        keys.forEach(k => { currentData[k] = localStorage.getItem(k); });
        lastBackup = currentData;
    }

    function undoLastAction() {
        if(!lastBackup) { alert("되돌릴 기록이 없습니다."); return; }
        if(confirm("이전 상태로 되돌릴까요?")) {
            Object.keys(localStorage).filter(k => k.startsWith('calcData')).forEach(k => localStorage.removeItem(k));
            Object.keys(lastBackup).forEach(k => localStorage.setItem(k, lastBackup[k]));
            location.reload();
        }
    }

    function calculate(id) {
        const face = Number(document.getElementById('face'+id).value); 
        const count = Number(document.getElementById('count'+id).value); 
        const buy = Number(document.getElementById('buy'+id).value); 
        const sellPrice = Number(document.getElementById('sellprice'+id).value); 
        const resDiv = document.getElementById('res'+id);

        if(!buy || !count || !face || !sellPrice) { resDiv.style.display = 'none'; return; }

        resDiv.style.display = 'grid';
        document.getElementById('totalBuy'+id).innerText = (buy * count).toLocaleString() + "원";
        document.getElementById('totalSell'+id).innerText = (sellPrice * count).toLocaleString() + "원";
        const mile = Math.floor(buy / 1500) * count;
        document.getElementById('totalMile'+id).innerText = mile.toLocaleString() + "M";
        document.getElementById('unit'+id).innerText = mile > 0 ? ((buy*count - sellPrice*count) / mile).toFixed(2) + "원" : "0원";
    }

    function createCard(id, savedData = null) {
        const data = savedData || { name: '롯데', customName: '', face: '', count: '', buy: '', sellPrice: '', time: '', locked: false };
        const isCustom = (data.name === '직접 입력');

        const html = `
        <div class="calc-card ${data.locked ? 'locked' : ''}" id="card-block-${id}">
            <div class="card-header-row">
                <div class="name-input-wrapper">
                    <select id="nameSelect${id}" class="name-select" ${data.locked?'disabled':''}>
                        <option value="롯데">롯데</option><option value="현대">현대</option><option value="신세계">신세계</option><option value="직접 입력">직접 입력</option>
                    </select>
                    <input type="text" id="nameCustomInput${id}" class="name-custom-input" 
                           value="${data.customName || ''}" placeholder="제목 입력" 
                           style="display: ${isCustom ? 'inline-block' : 'none'};" ${data.locked?'disabled':''}>
                </div>
                <span id="time${id}" class="update-time">${data.time || ''}</span>
                <button class="lock-btn ${data.locked?'active':''}" onclick="toggleLock(${id})">${data.locked?'🔓 해제':'🔒 잠금'}</button>
                <button class="del-item-btn" onclick="deleteCard(${id})" style="visibility:${data.locked?'hidden':'visible'}">✕</button>
            </div>
            <div class="input-row">
                <div class="input-box"><label>권종</label><input type="number" id="face${id}" value="${data.face}" ${data.locked?'disabled':''}></div>
                <div class="input-box"><label>매수</label><input type="number" id="count${id}" value="${data.count}" ${data.locked?'disabled':''}></div>
            </div>
            <div class="input-row">
                <div class="input-box"><label>구매가</label><input type="number" id="buy${id}" value="${data.buy}" ${data.locked?'disabled':''}></div>
                <div class="input-box"><label>매입가</label><input type="number" id="sellprice${id}" value="${data.sellPrice}" ${data.locked?'disabled':''}></div>
            </div>
            <div id="res${id}" class="result-area">
                <div class="res-item"><span>총 구매</span><span id="totalBuy${id}" class="res-val">-</span></div>
                <div class="res-item"><span>총 매입</span><span id="totalSell${id}" class="res-val">-</span></div>
                <div class="res-item"><span>마일리지</span><span id="totalMile${id}" class="res-val">-</span></div>
                <div class="res-item unit-price"><span>마일당 단가</span><span id="unit${id}" class="res-val">-</span></div>
            </div>
        </div>`;
        document.getElementById('calculator-list').insertAdjacentHTML('beforeend', html);
        
        const sel = document.getElementById('nameSelect'+id);
        const inp = document.getElementById('nameCustomInput'+id);
        sel.value = data.name;
        sel.addEventListener('change', () => {
            const isC = sel.value === '직접 입력';
            inp.style.display = isC ? 'inline-block' : 'none';
            if(isC) inp.focus(); else inp.value = '';
            autoSaveCard(id);
        });
        if(data.buy) calculate(id);
    }

    function autoSaveCard(id) {
        const card = document.getElementById('card-block-'+id);
        if(!card) return;
        const now = new Date();
        const yy = String(now.getFullYear()).slice(-2);
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const hh = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        const timeStr = `${yy}-${mm}-${dd} ${hh}:${min}`;
        
        const data = {
            name: document.getElementById('nameSelect'+id).value,
            customName: document.getElementById('nameCustomInput'+id).value,
            face: document.getElementById('face'+id).value,
            count: document.getElementById('count'+id).value,
            buy: document.getElementById('buy'+id).value,
            sellPrice: document.getElementById('sellprice'+id).value,
            time: timeStr,
            locked: card.classList.contains('locked')
        };
        localStorage.setItem('calcData'+id, JSON.stringify(data));
        document.getElementById('time'+id).innerText = (data.locked ? "🔒 " : "") + data.time;
    }

    document.addEventListener('input', (e) => {
        const id = e.target.id.replace(/[^\d]/g, '');
        if(id) { autoSaveCard(id); calculate(id); }
        if(e.target.id === 'mainMemo') localStorage.setItem('userMemo', e.target.value);
    });

    function addCalculator() {
        backupCurrentState();
        const cards = document.querySelectorAll('.calc-card');
        let maxId = 0;
        cards.forEach(c => { const id = parseInt(c.id.replace('card-block-','')); if(id > maxId) maxId = id; });
        createCard(maxId + 1);
    }

    function toggleLock(id) {
        const card = document.getElementById('card-block-'+id);
        const isLocked = card.classList.toggle('locked');
        card.querySelectorAll('input, select').forEach(el => el.disabled = isLocked);
        if(!isLocked) {
            const sel = document.getElementById('nameSelect'+id);
            document.getElementById('nameCustomInput'+id).disabled = (sel.value !== '직접 입력');
        }
        card.querySelector('.lock-btn').innerText = isLocked ? '🔓 해제' : '🔒 잠금';
        card.querySelector('.lock-btn').classList.toggle('active', isLocked);
        card.querySelector('.del-item-btn').style.visibility = isLocked ? 'hidden' : 'visible';
        autoSaveCard(id);
    }

    function deleteCard(id) { if(confirm("삭제할까요?")) { backupCurrentState(); document.getElementById('card-block-'+id).remove(); localStorage.removeItem('calcData'+id); } }
    function clearAllData() { if(confirm("초기화할까요?")) { backupCurrentState(); localStorage.clear(); location.reload(); } }
    
    function toggleCalc() { const c = document.getElementById('calc-content'); c.classList.toggle('active'); document.getElementById('calc-arrow').innerText = c.classList.contains('active') ? "▲" : "▼"; }
    function inputCalc(v) { calcExpr += v; document.getElementById('calc-display').innerText = calcExpr; }
    function clearCalc() { calcExpr = ""; document.getElementById('calc-display').innerText = "0"; }
    function runCalc() { try { calcExpr = eval(calcExpr).toString(); document.getElementById('calc-display').innerText = calcExpr; } catch(e) { clearCalc(); } }

    function handleMemory(n) {
        const display = document.getElementById('calc-display').innerText;
        const btn = document.getElementById('mem'+n);
        if (memories[n] === null) {
            if (display === "0" || !display) { alert("저장할 숫자가 없습니다."); return; }
            memories[n] = display;
            btn.innerText = "M" + n + ": " + display;
            btn.classList.add('active');
        } else {
            inputCalc(memories[n]);
            if(confirm("M"+n+"의 내용을 비울까요?")) {
                memories[n] = null;
                btn.innerText = "M" + n + " 저장";
                btn.classList.remove('active');
            }
        }
    }

    // 공통 리포트 생성 함수
    function generateReport() {
        let report = "📊 [상테크 리포트 상세]\n\n";
        const cards = document.querySelectorAll('.calc-card');
        let hasData = false;
        let index = 1;

        cards.forEach(card => {
            const id = card.id.replace('card-block-', '');
            const selValue = document.getElementById('nameSelect'+id).value;
            const customValue = document.getElementById('nameCustomInput'+id).value;
            const title = (selValue === '직접 입력') ? (customValue || '직접입력') : selValue;
            const timeStr = document.getElementById('time'+id).innerText.replace("🔒 ", "");
            const face = document.getElementById('face'+id).value;
            const count = document.getElementById('count'+id).value;
            const buy = document.getElementById('buy'+id).value;
            const sellPrice = document.getElementById('sellprice'+id).value;
            const totalBuy = document.getElementById('totalBuy'+id).innerText;
            const totalMile = document.getElementById('totalMile'+id).innerText;
            const unitPrice = document.getElementById('unit'+id).innerText;

            if(totalBuy && totalBuy !== "-") {
                report += `${index}. ${title} (${timeStr})\n`;
                report += `└ 요약: ${Number(face).toLocaleString()}원 × ${count}매\n`;
                report += `└ 가격: 구매 ${Number(buy).toLocaleString()}원 / 매입 ${Number(sellPrice).toLocaleString()}원\n`;
                report += `└ 결과: 총액 ${totalBuy} / 마일리지 ${totalMile} / 단가 : ${unitPrice}\n\n`;
                hasData = true;
                index++;
            }
        });

        const memo = document.getElementById('mainMemo').value;
        if(memo) report += "📝 메모사항:\n" + memo;
        return (hasData || memo) ? report : null;
    }

    function copyToClipboard() {
        const report = generateReport();
        if(!report) { alert("복사할 내용이 없습니다."); return; }
        const t = document.createElement("textarea");
        document.body.appendChild(t);
        t.value = report; t.select();
        document.execCommand('copy');
        document.body.removeChild(t);
        alert("상세 리포트가 복사되었습니다!");
    }

    // 시트로 리포트 전송
    function sendReportToSheet() {
        const report = generateReport();
        if(!report) { alert("전송할 내용이 없습니다."); return; }

        const btn = document.getElementById('reportSendBtn');
        const originalText = btn.innerText;
        btn.disabled = true; btn.innerText = "전송 중..."; btn.style.opacity = "0.6";

        fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ report: report }) })
        .then(() => { alert("구글 시트에 리포트가 저장되었습니다."); })
        .catch(() => { alert("오류 발생"); })
        .finally(() => { btn.disabled = false; btn.innerText = originalText; btn.style.opacity = "1"; });
    }

    function sendOpinion(e) {
        const val = document.getElementById('opinionInput').value;
        if(!val) return;
        const btn = document.getElementById('sendBtn');
        const originalText = btn.innerText;
        btn.disabled = true; btn.innerText = "전송 중..."; btn.style.opacity = "0.6";

        fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ opinion: val }) })
        .then(() => { alert("전송완료"); document.getElementById('opinionInput').value=""; loadOpinions(); })
        .catch(() => { alert("오류 발생"); })
        .finally(() => { btn.disabled = false; btn.innerText = originalText; btn.style.opacity = "1"; });
    }

    function loadOpinions() {
        fetch(SCRIPT_URL).then(res => res.json()).then(data => {
            document.getElementById('feedbackList').innerHTML = data.slice(0,10).map(i => `<div style="border-bottom:1px solid #eee; padding:5px 0;"><b>${new Date(i.date).toLocaleDateString()}</b>: ${i.opinion}</div>`).join('');
        }).catch(() => {});
    }

    function init() {
        const keys = Object.keys(localStorage).filter(k => k.startsWith('calcData')).map(k => parseInt(k.replace('calcData', ''))).sort((a,b)=>a-b);
        if (keys.length === 0) { for(let i=1; i<=2; i++) createCard(i); } 
        else { keys.forEach(k => createCard(k, JSON.parse(localStorage.getItem('calcData'+k)))); }
        document.getElementById('mainMemo').value = localStorage.getItem('userMemo') || '';
        loadOpinions();
    }
    init();
</script>
</body>
</html>
