<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>일반합산 계산기</title>
    <style>
        /* 아이폰 더블 탭 확대 방지를 위해 touch-action 추가 */
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }

        .calculator {
            width: 100%;
            max-width: 400px;
            background-color: #fff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }

        .display-area {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: right;
        }

        #history {
            font-size: 14px;
            color: #6c757d;
            height: 20px;
            margin-bottom: 5px;
            overflow: hidden;
        }

        #result {
            font-size: 32px;
            font-weight: bold;
            color: #212529;
            word-wrap: break-word;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            padding: 20px 10px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background-color: #e9ecef;
            cursor: pointer;
            transition: background-color 0.2s;
            /* 버튼 레벨에서도 다시 한번 확대 방지 강화 */
            touch-action: manipulation;
        }

        button:active {
            background-color: #dee2e6;
        }

        .operator {
            background-color: #fd7e14;
            color: white;
        }

        .operator:active {
            background-color: #e8590c;
        }

        .reset-btn {
            grid-column: span 4;
            background-color: #dc3545;
            color: white;
            margin-top: 10px;
        }

        .reset-btn:active {
            background-color: #c82333;
        }
    </style>
</head>
<body>

<div class="calculator">
    <div class="display-area">
        <div id="history">0</div>
        <div id="result">0</div>
    </div>
    <div class="grid">
        <button onclick="append(7)">7</button>
        <button onclick="append(8)">8</button>
        <button onclick="append(9)">9</button>
        <button class="operator" onclick="setOp('+')">+</button>
        
        <button onclick="append(4)">4</button>
        <button onclick="append(5)">5</button>
        <button onclick="append(6)">6</button>
        <button class="operator" onclick="calculate()">=</button>
        
        <button onclick="append(1)">1</button>
        <button onclick="append(2)">2</button>
        <button onclick="append(3)">3</button>
        <button onclick="append(0)">0</button>

        <button class="reset-btn" onclick="resetAll()">모든 데이터 초기화</button>
    </div>
</div>

<script>
    let currentInput = "0";
    let totalSum = 0;

    // 3자리 쉼표 포맷팅 함수
    function formatNumber(num) {
        let parts = num.toString().split(".");
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d)/g, ",");
        return parts.join(".");
    }

    function updateDisplay() {
        document.getElementById('result').innerText = formatNumber(currentInput);
        document.getElementById('history').innerText = "합계: " + formatNumber(totalSum);
    }

    function append(num) {
        if (currentInput === "0") {
            currentInput = num.toString();
        } else {
            currentInput += num.toString();
        }
        updateDisplay();
    }

    function calculate() {
        totalSum += parseFloat(currentInput);
        currentInput = "0";
        updateDisplay();
    }

    function setOp(op) {
        if (op === '+') {
            calculate();
        }
    }

    function resetAll() {
        currentInput = "0";
        totalSum = 0;
        updateDisplay();
    }

    updateDisplay();
</script>

</body>
</html>
